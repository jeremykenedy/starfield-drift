<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" role="img" aria-labelledby="title desc">
  <title id="title">Starfield Drift</title>
  <desc id="desc">Animated starfield screensaver with no ads, analytics, or tracking.</desc>
